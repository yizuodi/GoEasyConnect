<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>EasyConnect</title>
  <style>
:root{--bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--text:#e0e0e0;--text2:#a0a0a0;--muted:#555;--accent:#4fc3f7;--accent2:#29b6f6;--border:#2a2a4a;--success:#66bb6a;--danger:#ef5350;--radius:10px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}

/* Login */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.login-box{width:100%;max-width:320px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center}
.login-box h1{font-size:24px;margin-bottom:6px}
.login-box .sub{color:var(--text2);font-size:13px;margin-bottom:20px}
.login-box input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:16px;outline:none;margin-bottom:14px}
.login-box input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;display:block}
.login-btn:active{background:var(--accent2)}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;display:none}

/* App */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Pages */
.page{flex:1;overflow-y:auto;display:none;flex-direction:column;-webkit-overflow-scrolling:touch}
.page.active{display:flex}

/* Page header */
.page-hd{padding:calc(16px + var(--safe-t)) 16px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.page-hd h2{font-size:20px;font-weight:700}

/* List */
.slist{flex:1;overflow-y:auto;padding:8px 8px 80px}
.sitem,.pitem{padding:14px 16px;border-radius:var(--radius);margin-bottom:6px;background:var(--bg2);border:1px solid var(--border)}
.sitem{min-height:56px;cursor:pointer;-webkit-user-select:none;user-select:none}
.sitem:active{background:var(--bg3)}
.sitem.on{border-color:var(--accent);background:var(--bg3)}
.sitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sitem-main{width:100%;display:flex;align-items:center;gap:12px}
.sitem-info{flex:1;min-width:0}
.sitem-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem-meta{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sitem-dot.run{background:var(--success)}
.sitem-dot.stop{background:var(--muted)}
.sitem-actions{display:flex;gap:8px;margin-top:10px;cursor:default}

/* FAB */
.fab{position:fixed;bottom:calc(72px + var(--safe-b));right:16px;width:52px;height:52px;background:var(--accent);color:#000;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:40;touch-action:manipulation}
.fab:active{transform:scale(.92)}

/* Tab bar */
.tabbar{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:var(--safe-b);flex-shrink:0;position:relative;z-index:30}
.tab{flex:1;padding:10px 0 8px;text-align:center;cursor:pointer;color:var(--text2);font-size:11px;-webkit-user-select:none;user-select:none;transition:color .15s;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px}

/* Terminal */
.term-hd{padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.term-back{background:none;border:none;color:var(--accent);font-size:28px;cursor:pointer;padding:8px 12px;min-width:44px;min-height:44px;line-height:1;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.term-title{flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-acts{display:flex;gap:6px;align-items:center}
.tbtn{padding:8px 12px;min-height:36px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:12px;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center}
.tbtn:active{background:var(--bg3)}
.tbtn.on{background:var(--accent);color:#000;border-color:var(--accent)}
.tbtn.danger{color:var(--danger);border-color:var(--danger)}
.tbtn.off{opacity:.4;pointer-events:none}
.tbtn:disabled{opacity:.4;pointer-events:none}
.term-body{flex:1;background:#0a0a14;overflow:hidden}
.term-ft{padding:10px 12px calc(10px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0}
.view-switch{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 12px;gap:6px;flex-shrink:0}
.view-switch .tbtn{flex:1}
.conv-view{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.conv-messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.conv-empty{margin:auto;color:var(--text2);text-align:center;line-height:1.6;padding:24px}
.conv-msg{max-width:92%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;font-size:14px}
.conv-msg.user{align-self:flex-end;background:#17506b;color:#fff;border-bottom-right-radius:4px}
.conv-msg.assistant{align-self:flex-start;background:var(--bg2);border:1px solid var(--border);border-bottom-left-radius:4px}
.conv-msg.assistant:empty::after{content:'正在思考…';color:var(--text2)}
.conv-tool{background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2)}
.conv-tool summary{padding:9px 10px;cursor:pointer;color:var(--text)}
.conv-tool pre{padding:0 10px 10px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.conv-error{padding:9px 10px;border:1px solid var(--danger);color:var(--danger);border-radius:8px;font-size:13px}
.conv-compose{padding:10px 10px calc(10px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.conv-compose textarea{flex:1;min-height:44px;max-height:140px;resize:none;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font:inherit;outline:none}
.conv-compose textarea:focus{border-color:var(--accent)}
.conv-send{height:44px;padding:0 15px;border:0;border-radius:9px;background:var(--accent);color:#000;font-weight:600}
.conv-hint{padding:7px 12px;background:#3b2d16;color:#ffd180;font-size:12px;border-bottom:1px solid #6d4c20}

/* Bottom Sheet / Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg2);border-radius:16px 16px 0 0;padding:20px 20px calc(20px + var(--safe-b));width:100%;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h3{font-size:18px;margin-bottom:16px}
.sheet label{display:block;font-size:13px;color:var(--text2);margin:12px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:16px;outline:none}
.sheet textarea{font-family:monospace;font-size:12px;min-height:160px;resize:vertical}
.sheet-btns{display:flex;gap:10px;margin-top:20px}
.sheet-btns button{flex:1;padding:14px;border:none;border-radius:var(--radius);font-size:15px;font-weight:500;cursor:pointer;touch-action:manipulation}
.btn-cancel{background:var(--bg3);color:var(--text)}
.btn-ok{background:var(--accent);color:#000}
.btn-ok:active,.btn-cancel:active{opacity:.7}

/* Profiles */
.pitem-name{font-size:15px;font-weight:500}
.pitem-desc{font-size:12px;color:var(--text2);margin-top:2px}
.pitem-btns{display:flex;gap:8px;margin-top:10px}

/* xterm */
.xterm{padding:4px}
.xterm-helper-textarea{position:absolute!important;left:-9999px!important;opacity:0!important;width:0!important;height:0!important}
.xterm-helpers,.xterm-width-cache-measure-container{position:absolute!important;left:-9999px!important;opacity:0!important;pointer-events:none!important}
.xterm-viewport::-webkit-scrollbar{width:4px}
.xterm-viewport::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.hidden{display:none!important}
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login" class="login">
    <div class="login-box">
      <h1 id="mLoginTitle">🔗 EasyConnect</h1>
      <p class="sub">Mobile</p>
      <input type="password" id="pw" placeholder="密码" autocomplete="off">
      <button id="loginBtn" class="login-btn">登录</button>
      <div id="loginErr" class="login-err">密码错误</div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <div id="pgSessions" class="page active">
      <div class="page-hd" style="display:flex;align-items:center;justify-content:space-between"><h2>会话</h2><div style="display:flex;gap:12px;align-items:center"><button id="updateBtn" class="tbtn" style="padding:4px 8px">↻ 更新</button><a href="/" style="color:var(--text2);text-decoration:none;font-size:13px">💻 电脑版</a></div></div>
      <div class="slist" id="sessionList"></div>
    </div>
    <div id="pgTerm" class="page">
      <div class="term-hd">
        <button class="term-back" id="btnBack">‹</button>
        <span class="term-title" id="termTitle">-</span>
        <div class="term-acts">
          <button class="tbtn" id="btnStart">▶</button>
          <button class="tbtn hidden" id="btnStop">■</button>
          <button class="tbtn" id="fsBtn" aria-pressed="false" title="进入全屏">⛶</button>
        </div>
      </div>
      <div class="view-switch hidden" id="viewSwitch">
        <button class="tbtn on" id="termViewBtn">原生终端</button>
        <button class="tbtn" id="chatViewBtn">对话模式</button>
      </div>
      <div class="term-body" id="termBox"></div>
      <div class="conv-view hidden" id="convView">
        <div class="conv-hint hidden" id="convHint"></div>
        <div class="conv-messages" id="convMessages"></div>
        <div class="conv-compose">
          <textarea id="convInput" rows="1" placeholder="发送消息；Enter 换行"></textarea>
          <button class="tbtn danger hidden" id="convStop">停止</button>
          <button class="conv-send" id="convSend">发送</button>
        </div>
      </div>
      <div class="term-ft" id="termFooter">
        <select id="profSel" class="prof-sel hidden"><option value="">默认</option></select>
        <button class="tbtn" id="wsBtn">WS</button>
        <button class="tbtn" id="spBtn">Skip</button>
        <button class="tbtn hidden" id="autoBtn">自动继续</button>
        <button class="tbtn" id="fbBtn">文件</button>
      </div>
    </div>
    <div id="pgProfiles" class="page">
      <div class="page-hd"><h2>配置</h2></div>
      <div class="slist" id="profileList"></div>
    </div>
    <button class="fab" id="fab">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="tabbar" id="tabbar">
      <div class="tab on" id="tabS" data-tab="sessions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        会话
      </div>
      <div class="tab" id="tabP" data-tab="profiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        配置
      </div>
    </div>
  </div>

  <!-- Sheet overlay -->
  <div id="overlay" class="overlay">
    <div class="sheet" id="sheet"></div>
  </div>

  <script src="/xterm.js"></script>
  <script src="/xterm-addon-fit.js"></script>
  <script>
const $=s=>document.getElementById(s);

// State
let token=localStorage.getItem('ec_token')||'';
let sid=null,sessions=[],profiles=[];
let ws=null,wsConnectGeneration=0,term=null,fit=null;
let usePolling=localStorage.getItem('ec_polling')==='true';
let pollSeq=0,pollTimer=null,POLL_MS=300;
let curPage='sessions',appCfg={},appDefaults={};
let sessionView='terminal',convTimer=null,convSeq=0,convEvents=[],convMessageKey='',convEventKey='';
let convAutoScroll=true,convLastScrollTop=0;
let convTurnMessages=new Map();

// ============ Events (addEventListener, no inline onclick) ============
$('loginBtn').addEventListener('click',doLogin);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('fab').addEventListener('click',onFab);
$('updateBtn').addEventListener('click',checkForUpdates);
$('btnBack').addEventListener('click',goSessions);
$('btnStart').addEventListener('click',doStart);
$('btnStop').addEventListener('click',doStop);
$('spBtn').addEventListener('click',toggleSP);
$('autoBtn').addEventListener('click',showAutoContinueSheet);
$('profSel').addEventListener('change',changeProfile);
$('fbBtn').addEventListener('click',openFB);
$('wsBtn').addEventListener('click',toggleWS);
$('fsBtn').addEventListener('click',toggleFullscreen);
$('chatViewBtn').addEventListener('click',()=>switchSessionView('conversation'));
$('termViewBtn').addEventListener('click',()=>switchSessionView('terminal'));
$('convSend').addEventListener('click',sendConversationMessage);
$('convStop').addEventListener('click',stopConversation);
$('convInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendConversationMessage();}});
$('convMessages').addEventListener('wheel',e=>{if(e.deltaY<0)convAutoScroll=false;},{passive:true});
$('convMessages').addEventListener('scroll',()=>{const box=$('convMessages'),current=box.scrollTop,distance=box.scrollHeight-current-box.clientHeight;if(current<convLastScrollTop-1)convAutoScroll=false;else if(distance<32)convAutoScroll=true;convLastScrollTop=current;},{passive:true});
$('tabS').addEventListener('click',()=>goTab('sessions'));
$('tabP').addEventListener('click',()=>goTab('profiles'));
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});
window.addEventListener('resize',fitTerminalView);
window.addEventListener('orientationchange',()=>setTimeout(fitTerminalView,120));
document.addEventListener('fullscreenchange',updateFullscreenBtn);
document.addEventListener('webkitfullscreenchange',updateFullscreenBtn);

// ============ Init ============
if(token)checkAuth();

// ============ Auth ============
async function api(path,opts={}){
  const h={'Authorization':'Bearer '+token};
  if(opts.body)h['Content-Type']='application/json';
  return fetch(path,{...opts,headers:h});
}
async function checkForUpdates(){
  const button=$('updateBtn');
  if(button){button.disabled=true;button.textContent='…';}
  try{
    const response=await api('/api/update');
    const status=await response.json();
    if(!response.ok)return alert(status.error||'检查更新失败');
    if(!status.enabled)return alert('当前版本未启用网页更新。');
    if(!status.updateAvailable)return alert('当前已经是最新版本 '+status.currentVersion+'。');
    if(!confirm('发现新版本 '+status.latestVersion+'（当前 '+status.currentVersion+'）。更新会自动备份并重启 EasyConnect，现在更新吗？'))return;
    const start=await api('/api/update',{method:'POST',body:'{}'});
    const result=await start.json();
    if(!start.ok)return alert(result.error||'启动更新失败');
    alert('更新已开始，页面可能会短暂断开。');
  }catch(error){alert('检查更新失败: '+(error.message||error));}
  finally{if(button){button.disabled=false;button.textContent='↻ 更新';}}
}
async function checkAuth(){
  try{const r=await api('/api/sessions');if(r.ok)enterApp();else{token='';localStorage.removeItem('ec_token');}}
  catch{token='';localStorage.removeItem('ec_token');}
}
async function doLogin(){
  const pw=$('pw').value;if(!pw)return;
  token=pw;localStorage.setItem('ec_token',pw);
  try{
    const r=await api('/api/sessions');
    if(r.ok){$('loginErr').style.display='none';enterApp();}
    else{$('loginErr').style.display='block';token='';localStorage.removeItem('ec_token');}
  }catch{$('loginErr').style.display='block';token='';localStorage.removeItem('ec_token');}
}
function enterApp(){
  $('login').style.display='none';
  $('app').classList.remove('hidden');
  api('/api/config').then(r=>r.json()).then(c=>{if(c.branding){const b=c.branding;document.title=b.documentTitle||'EasyConnect';const t=$('mLoginTitle');if(t)t.textContent=(b.emoji||'🔗')+' '+((b.name||'EasyConnect'));}});
  api('/api/app-config').then(r=>r.json()).then(c=>{appCfg=c;POLL_MS=c.pollIntervalMs||300;}).catch(()=>{}).then(()=>refresh());
  api('/api/defaults').then(r=>r.json()).then(d=>{appDefaults=d;});
}

// ============ Navigation ============
function goTab(tab){
  curPage=tab;
  $('pgSessions').classList.toggle('active',tab==='sessions');
  $('pgProfiles').classList.toggle('active',tab==='profiles');
  $('pgTerm').classList.remove('active');
  $('tabS').classList.toggle('on',tab==='sessions');
  $('tabP').classList.toggle('on',tab==='profiles');
  $('fab').classList.remove('hidden');
  $('tabbar').style.display='';
}
function goSessions(){
  sid=null;disconnectAll();stopConversationPoll();
  updateSessionURL(null);
  if(term){term.dispose();term=null;}
  curPage='sessions';
  $('pgSessions').classList.add('active');
  $('pgTerm').classList.remove('active');
  $('tabS').classList.add('on');
  $('tabP').classList.remove('on');
  $('fab').classList.remove('hidden');
  $('tabbar').style.display='';
  api('/api/app-config').then(r=>r.json()).then(c=>{appCfg=c;POLL_MS=c.pollIntervalMs||300;});
  refresh();
}
async function goTerm(s){
  sid=s.id;curPage='terminal';
  $('pgSessions').classList.remove('active');
  $('pgProfiles').classList.remove('active');
  $('pgTerm').classList.add('active');
  $('tabS').classList.remove('on');
  $('tabP').classList.remove('on');
  $('fab').classList.add('hidden');
  $('tabbar').style.display='none';
  updateTermTitle(s);
  const enabled=!!appCfg.experimental?.conversationMode;
  $('viewSwitch').classList.toggle('hidden',!enabled);
  sessionView=enabled?(s.running_mode||s.run_mode||'terminal'):'terminal';
  updateSessionURL(s.id,sessionView);
  updateCtrl(s);
  updateWsBtn();
  disconnectAll();stopConversationPoll();
  if(sessionView==='conversation')await openConversation(s);
  else{showTerminalView();initTerm();await loadHistory(s.id);}
  if(sid!==s.id||curPage!=='terminal')return;
  if(sessionView==='terminal'&&s.terminal_running){if(usePolling)startPoll(s.id);else connectWS(s.id);}
  fitTerminalView();
}

// ============ Refresh ============
async function refresh(){
  const[sr,pr]=await Promise.all([api('/api/sessions'),api('/api/profiles')]);
  if(sr.ok)sessions=await sr.json();
  if(pr.ok)profiles=await pr.json();
  const current=sessions.find(x=>x.id===sid);
  if(current){
    const profileSelect=$('profSel');
    populateProfSelect(profileSelect,current.agent);
    profileSelect.value=current.profile_id||'';
    updateCtrl(current);
  }
  renderS();renderP();
  if(!sid){
    const requestedID=new URL(window.location.href).searchParams.get('session');
    if(requestedID){const requested=sessions.find(x=>x.id===requestedID);if(requested)await goTerm(requested);else updateSessionURL(null);}
  }
}

function updateSessionURL(id,mode=''){const url=new URL(window.location.href);if(id){url.searchParams.set('session',id);if(mode==='terminal'||mode==='conversation')url.searchParams.set('mode',mode);else url.searchParams.delete('mode');}else{url.searchParams.delete('session');url.searchParams.delete('mode');}window.history.replaceState({},'',url);}

// ============ Sessions ============
function renderS(){
  const el=$('sessionList');

async function saveAutoContinue(enabled){

async function openConversation(s){
  if(term){term.dispose();term=null;}
  $('termBox').classList.add('hidden');$('convView').classList.remove('hidden');$('termFooter').classList.remove('hidden');
  $('chatViewBtn').classList.add('on');$('termViewBtn').classList.remove('on');
  convSeq=0;convEvents=[];convMessageKey='';convEventKey='';convAutoScroll=true;convLastScrollTop=0;convTurnMessages=new Map();
  updateConvHint(s);
  await pollConversation(s.id,true);
}
function stopConversationPoll(){if(convTimer){clearTimeout(convTimer);convTimer=null;}}
async function pollConversation(id,immediate=false){
  stopConversationPoll();if(!sid||sid!==id||sessionView!=='conversation')return;
  try{
    const[mr,er]=await Promise.all([api('/api/sessions/'+id+'/conversation/messages'),api('/api/sessions/'+id+'/conversation/events?after='+convSeq)]);
    if(mr.ok){const data=await mr.json();renderConversation(data.messages||[]);setConversationState(!!data.running,!!data.session_running);}
    if(er.ok){const data=await er.json();for(const ev of(data.events||[])){convSeq=Math.max(convSeq,ev.seq||0);rememberConvContext(ev);if(ev.type.startsWith('tool.')||ev.type==='file.change'||ev.type==='turn.failed')mergeConvEvent(ev);}renderConversationEvents();setConversationState(!!data.running,!!data.session_running);}
  }catch{}
  if(sid===id&&sessionView==='conversation')convTimer=setTimeout(()=>pollConversation(id),immediate?100:700);
}
function renderConversation(messages){
  const key=messages.map(m=>m.id+':'+m.content).join('|');if(key===convMessageKey)return;convMessageKey=key;convEventKey='';
  const box=$('convMessages');updateConvDOM(box,()=>{box.querySelectorAll('.conv-msg,.conv-empty').forEach(n=>n.remove());if(!messages.length){const e=document.createElement('div');e.className='conv-empty';e.textContent='对话模式\n停止会话后可切换到原生终端';box.prepend(e);}else for(const m of messages){const el=document.createElement('div');el.className='conv-msg '+(m.role==='user'?'user':'assistant');el.dataset.messageId=m.id;el.textContent=m.content||'';box.insertBefore(el,box.querySelector('.conv-tool,.conv-error'));}});renderConversationEvents();
}
function updateConvDOM(box,update){const previous=box.scrollTop,follow=convAutoScroll;update();box.scrollTop=follow?box.scrollHeight:previous;convLastScrollTop=box.scrollTop;}
function rememberConvContext(ev){if(!ev.turn_id)return;const messageId=ev.payload?.assistant_message_id||(ev.type==='assistant.message'?ev.payload?.message_id:'');if(!messageId||convTurnMessages.get(ev.turn_id)===messageId)return;convTurnMessages.set(ev.turn_id,messageId);convEventKey='';}
function mergeConvEvent(ev){
  const lifecycle=ev.type.startsWith('tool.')||ev.type==='file.change';
  const key=lifecycle&&ev.item_id?(ev.turn_id||'')+':'+ev.item_id:ev.type==='turn.failed'&&ev.turn_id?ev.turn_id+':turn.failed':'';
  if(!key){convEvents.push(ev);return;}
  ev._displayKey=key;const index=convEvents.findIndex(item=>item._displayKey===key);
  if(index<0)convEvents.push(ev);else convEvents[index]=ev;
}
function convEventBody(p){
  if(p.output)return p.output;
  if(Array.isArray(p.changes)&&p.changes.length)return JSON.stringify(p.changes,null,2);
  if(p.changes&&typeof p.changes==='object'&&Object.keys(p.changes).length)return JSON.stringify(p.changes,null,2);
  return p.status||(p.phase==='started'?'执行中…':'无输出');
}
function renderConversationEvents(){
  const visible=convEvents.slice(-50),key=visible.map(ev=>(ev.seq||0)+':'+ev.type+':'+JSON.stringify(ev.payload||{})).join('|');if(key===convEventKey)return;convEventKey=key;
  const box=$('convMessages');updateConvDOM(box,()=>{box.querySelectorAll('.conv-tool,.conv-error').forEach(n=>n.remove());const messageElements=new Map();box.querySelectorAll('.conv-msg[data-message-id]').forEach(node=>messageElements.set(node.dataset.messageId,node));for(const ev of visible){const p=ev.payload||{},messageId=p.assistant_message_id||convTurnMessages.get(ev.turn_id),anchor=messageElements.get(messageId);if(!anchor)continue;if(ev.type==='turn.failed'){const e=document.createElement('div');e.className='conv-error';e.textContent=p.message||'执行失败';box.insertBefore(e,anchor);continue;}const d=document.createElement('details');d.className='conv-tool';const title=p.command||p.kind||'文件变更';d.innerHTML='<summary>'+esc(title)+'</summary><pre>'+esc(convEventBody(p))+'</pre>';box.insertBefore(d,anchor);}});
}
function setConversationBusy(busy){const s=sessions.find(x=>x.id===sid);setConversationState(busy,!!s?.conversation_running);}
function setConversationState(busy,sessionRunning){$('convSend').classList.toggle('hidden',busy);$('convStop').classList.toggle('hidden',!busy);const s=sessions.find(x=>x.id===sid);if(s){s.turn_running=busy;s.conversation_running=sessionRunning;s.isRunning=!!(s.terminal_running||sessionRunning);if(!s.isRunning)s.running_mode='';$('convInput').disabled=busy||!sessionRunning;$('convSend').disabled=!sessionRunning;updateCtrl(s);renderS();}}

function fullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function updateFullscreenBtn(){
  const b=$('fsBtn');if(!b)return;
  const active=!!fullscreenElement();
  const supported=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
  b.disabled=!supported;
  b.textContent=active?'🗗':'⛶';
  b.classList.toggle('on',active);
  b.setAttribute('aria-pressed',String(active));
  b.title=supported?(active?'退出全屏':'进入全屏'):'当前浏览器不支持全屏';
}
async function toggleFullscreen(){
  try{
    if(fullscreenElement()){
      const exit=document.exitFullscreen||document.webkitExitFullscreen;
      if(exit)await exit.call(document);
    }else{
      const root=document.documentElement;
      const request=root.requestFullscreen||root.webkitRequestFullscreen;
      if(request)await request.call(root);
    }
  }catch(error){console.warn('切换全屏失败:',error);}
  finally{updateFullscreenBtn();setTimeout(fitTerminalView,120);}
}

function initTerm(){
  if(term){term.dispose();term=null;}
  const box=$('termBox');box.innerHTML='';
  term=new Terminal({
    theme:{background:'#0a0a14',foreground:'#c0c0c0',cursor:'#4fc3f7',selectionBackground:'#264f78',
      black:'#000',red:'#ef5350',green:'#66bb6a',yellow:'#ffa726',blue:'#42a5f5',magenta:'#ab47bc',cyan:'#4fc3f7',white:'#e0e0e0',
      brightBlack:'#666',brightRed:'#ef5350',brightGreen:'#66bb6a',brightYellow:'#ffa726',brightBlue:'#64b5f6',brightMagenta:'#ce93d8',brightCyan:'#80deea',brightWhite:'#fff'},
    fontFamily:'Menlo,Monaco,"Courier New",monospace',fontSize:12,lineHeight:1.3,cursorBlink:true,scrollback:5000,convertEol:false
  });
  fit=new FitAddon.FitAddon();

function fitTerminalView(){try{if(fit)fit.fit();}catch{}}
async function loadHistory(id){

  if(!r.ok)return;
  const messages=await r.json();
  messages.forEach(m=>{
    if(m.role==='user')term?.write('\x1b[1;36m> '+m.content+'\x1b[0m\r\n');
    else if(m.content)term?.write(m.content);
  });
}
function sendInput(d){
  if(!sid)return;
  if(usePolling)api('/api/sessions/'+sid+'/input',{method:'POST',body:JSON.stringify({data:d})});
  else if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'input',sessionId:sid,data:d}));
}
function sendResize(c,r){
  if(!sid)return;
  if(usePolling)api('/api/sessions/'+sid+'/resize',{method:'POST',body:JSON.stringify({cols:c,rows:r})});
  else if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'resize',sessionId:sid,cols:c,rows:r}));

// ============ WebSocket ============
async function connectWS(id){
  stopPoll();
  const generation=++wsConnectGeneration;
  let response;
  try{response=await api('/api/ws-ticket',{method:'POST'});}catch(error){console.warn('获取 WebSocket 凭据失败:',error);return;}
  if(!response.ok||generation!==wsConnectGeneration||sid!==id)return;
  const data=await response.json();
  if(!data.ticket||generation!==wsConnectGeneration||sid!==id)return;
  const p=location.protocol==='https:'?'wss:':'ws:';
  const socket=new WebSocket(p+'//'+location.host+'/ws?ticket='+encodeURIComponent(data.ticket));
  ws=socket;
  socket.onopen=()=>{if(generation!==wsConnectGeneration)return socket.close();socket.send(JSON.stringify({type:'subscribe',sessionId:id}));};
  socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='output'&&term)term.write(m.data);else if(m.type==='exit')handleExit(m.exitCode);}catch{}};
  socket.onclose=()=>{if(ws===socket)ws=null;};
}
function disconnectWS(){wsConnectGeneration++;if(ws){ws.close();ws=null;}}

// ============ Polling ============
function startPoll(id){disconnectWS();pollSeq=0;doPoll(id);}
function doPoll(id){
  if(pollTimer)clearTimeout(pollTimer);
  if(!sid||sid!==id||!usePolling)return;
  api('/api/sessions/'+id+'/output?seq='+pollSeq).then(r=>r.json()).then(d=>{
    if(d.output&&term)term.write(d.output);
    if(d.running){pollSeq=d.seq;pollTimer=setTimeout(()=>doPoll(id),POLL_MS);}
    else handleExit(0);
  }).catch(()=>{pollTimer=setTimeout(()=>doPoll(id),2000);});
}
function stopPoll(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}}
function disconnectAll(){disconnectWS();stopPoll();}
function handleExit(code){
  if(term)term.write('\r\n\x1b[33m[进程退出, code='+(code||0)+']\x1b[0m\r\n');
  const s=sessions.find(x=>x.id===sid);
  if(s){s.terminal_running=false;s.isRunning=!!s.conversation_running;updateCtrl(s);}
  api('/api/app-config').then(r=>r.json()).then(c=>{appCfg=c;POLL_MS=c.pollIntervalMs||300;});
  refresh();
}

  sheet(`<h3>新建会话</h3><label>名称</label><input id="sName" placeholder="my-project"><label>智能体</label><select id="sAgent"><option value="claude">Claude Code</option><option value="codex">Codex</option></select><div id="sProfGroup"><label>配置</label><select id="sProf"></select></div><div id="sModeGroup" class="hidden"><label>启动模式</label><select id="sMode"><option value="terminal">原生终端</option><option value="conversation">对话模式</option></select><small>运行中不能切换，需停止后重新选择并启动。</small></div><label>工作目录</label><input id="sDir" value="${escAttr(defaultDir)}" placeholder="/home/user/code"><div class="sheet-btns"><button class="btn-cancel" id="shCancel">取消</button><button class="btn-ok" id="shOk">创建</button></div>`);
  $('sAgent').value=appCfg.defaultAgent||'claude';
  const syncAgent=()=>{const agent=$('sAgent').value;populateProfSelect($('sProf'),agent);$('sModeGroup').classList.toggle('hidden',!appCfg.experimental?.conversationMode);};
  $('sAgent').addEventListener('change',syncAgent);syncAgent();
  $('shCancel').addEventListener('click',closeSheet);
  $('shOk').addEventListener('click',createSession);
}
async function createSession(){
  const name=$('sName').value.trim();if(!name)return alert('请输入名称');
  const profile_id=$('sProf').value||null;
  const agent=$('sAgent').value;
  const run_mode=appCfg.experimental?.conversationMode?$('sMode').value:'terminal';
  const working_dir=$('sDir').value.trim()||appDefaults.workingDir||appCfg.defaultWorkingDir||'/home/user/code';
  const r=await api('/api/sessions',{method:'POST',body:JSON.stringify({name,agent,profile_id,working_dir,run_mode})});
  if(!r.ok){const e=await r.json();return alert(e.error||'失败');}
  const data=await r.json();
  closeSheet();await refresh();
  const s=sessions.find(x=>x.id===data.id);
  if(s)goTerm(s);
}

function editSessionSheet(id){
  const s=sessions.find(x=>x.id===id);if(!s)return;
  if(s.isRunning)return alert('请先停止会话再编辑');
  sheet(`<h3>编辑会话: ${esc(s.name)}</h3><label>名称</label><input id="sEditName" value="${escAttr(s.name)}"><div class="sheet-btns"><button class="btn-cancel" id="shCancel">取消</button><button class="btn-ok" id="shOk">保存</button></div>`);
  $('shCancel').addEventListener('click',closeSheet);
  $('shOk').addEventListener('click',()=>updateSession(id));
}
async function updateSession(id){
  const name=$('sEditName').value.trim();
  if(!name)return alert('请输入名称');
  const r=await api('/api/sessions/'+id,{method:'PATCH',body:JSON.stringify({name})});
  if(!r.ok){let e={};try{e=await r.json();}catch{}return alert(e.error||'保存失败');}
  closeSheet();await refresh();
}

// ============ Profile Sheet ============
function newProfSheet(){
  const fallbackClaudeTemplate={hasCompletedOnboarding:true,env:{ANTHROPIC_AUTH_TOKEN:"",ANTHROPIC_BASE_URL:"",ANTHROPIC_DEFAULT_OPUS_MODEL:"",ANTHROPIC_DEFAULT_SONNET_MODEL:"",ANTHROPIC_DEFAULT_HAIKU_MODEL:""}};
  const claudeTemplate=appDefaults.profileContent||fallbackClaudeTemplate;
  const codexTemplate=appDefaults.codexProfileContent||'# Custom provider; credentials are injected only into this session\napi_key = ""\nbase_url = ""\nmodel = ""\nwire_api = "responses"\n';
  sheet(`<h3>新建配置</h3><label>智能体</label><select id="pAgent"><option value="claude">Claude Code (JSON)</option><option value="codex">Codex (TOML)</option></select><label>名称</label><input id="pName" placeholder="如：production"><label>描述</label><input id="pDesc" placeholder="可选"><label id="pFormat">JSON</label><textarea id="pJson"></textarea><div class="sheet-btns"><button class="btn-cancel" id="shCancel">取消</button><button class="btn-ok" id="shOk">创建</button></div>`);
  const sync=()=>{const codex=$('pAgent').value==='codex';$('pFormat').textContent=codex?'TOML':'JSON';$('pJson').value=codex?codexTemplate:JSON.stringify(claudeTemplate,null,2);};
  $('pAgent').addEventListener('change',sync);sync();
  $('shCancel').addEventListener('click',closeSheet);
  $('shOk').addEventListener('click',createProf);
}
async function createProf(){
  const name=$('pName').value.trim();if(!name)return alert('请输入名称');
  const description=$('pDesc').value.trim();
  const content=$('pJson').value;
  const agent=$('pAgent').value;
  if(agent==='claude'){try{JSON.parse(content);}catch{return alert('JSON格式错误');}}
  const r=await api('/api/profiles',{method:'POST',body:JSON.stringify({name,agent,description,content})});
  if(r.ok){closeSheet();refresh();}else{const e=await r.json();alert(e.error||'失败');}
}
async function editProf(id){
  const p=profiles.find(x=>x.id===id);if(!p)return;
  sheet(`<h3>编辑 ${p.agent==='codex'?'Codex':'Claude'} 配置: ${esc(p.name)}</h3><label>名称</label><input id="pName" value="${escAttr(p.name)}"><label>描述</label><input id="pDesc" value="${escAttr(p.description||'')}"><label>${p.agent==='codex'?'TOML':'JSON'}</label><textarea id="pJson">${esc(p.content)}</textarea><div class="sheet-btns"><button class="btn-cancel" id="shCancel">取消</button><button class="btn-ok" id="shOk">保存</button></div>`);
  $('shCancel').addEventListener('click',closeSheet);
  $('shOk').addEventListener('click',()=>updateProf(id));
}
async function updateProf(id){
  const name=$('pName').value.trim();
  const description=$('pDesc').value.trim();
  const content=$('pJson').value;
  const p=profiles.find(x=>x.id===id);
  if((p?.agent||'claude')==='claude'){try{JSON.parse(content);}catch{return alert('JSON格式错误');}}
  const response=await api('/api/profiles/'+id,{method:'PUT',body:JSON.stringify({name,description,content})});
  if(!response.ok){const e=await response.json();return alert(e.error||'保存失败');}
  closeSheet();refresh();
}
async function delProf(id){
  if(!confirm('确定删除？'))return;
  await api('/api/profiles/'+id,{method:'DELETE'});
  api('/api/app-config').then(r=>r.json()).then(c=>{appCfg=c;POLL_MS=c.pollIntervalMs||300;});
  refresh();
}

// ============ Sheet ============
function sheet(html){$('sheet').innerHTML=html;$('overlay').classList.add('show');}
function closeSheet(){$('overlay').classList.remove('show');}

// ============ Util ============
function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function escAttr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
setInterval(()=>{if(token)refresh();},15000);
  </script>
