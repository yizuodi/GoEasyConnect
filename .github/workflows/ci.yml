name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test installer
        run: bash scripts/install_test.sh
      - name: Test conversation feed client
        run: node --test scripts/conversation_feed_test.cjs
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -buildvcs=false -count=1 ./...
      - name: Race detector
        run: go test -buildvcs=false -race -count=1 ./...
      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
      - name: Package Linux amd64 build
        env:
          ARCHES: amd64
        run: VERSION="${GITHUB_SHA:0:12}" ./scripts/package.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GoEasyConnect-linux-amd64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
